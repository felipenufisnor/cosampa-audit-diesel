[project]
name = "audit-diesel"
version = "0.1.0"
description = "POC de auditoria automatizada de diesel para o consorcio ARCO Metropolitano JP."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "rich>=13.7",
    "sqlmodel>=0.0.16",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "tenacity>=9.0",
    "httpx>=0.27",
    "weasyprint>=68.1",
    "jinja2>=3.1.6",
]

[project.scripts]
audit-diesel = "audit_diesel.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_diesel"]

[tool.uv]
# Instala o pacote local em modo gerenciado pelo uv (necessario para o entry
# point `audit-diesel` ser registrado no .venv).
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "real_llm: opt-in tests that call the configured external LLM provider",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pypdf>=6.11.0",
]
